<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Surveillance v9.1</title>
    <style>
      :root {
        --glass: rgba(15, 0, 0, 0.85);
        --cyan: #00d4ff;
        --green: #4ade80;
        --red: #ff0000;
      }

      body {
        background: #000;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: white;
        font-family: "Courier New", monospace;
      }

      /* --- MATRIX BACKGROUND --- */
      .matrix-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        color: var(--red);
        font-size: 18px;
        z-index: -1;
        opacity: 0.25;
        user-select: none;
      }

      .matrix-column {
        position: absolute;
        top: -100%;
        width: 20px;
        text-align: center;
        animation: fall linear infinite;
      }

      @keyframes fall {
        0% {
          top: -100%;
        }
        100% {
          top: 100%;
        }
      }

      /* --- UI CARD --- */
      .card {
        background: var(--glass);
        padding: 2rem;
        border-radius: 15px;
        border: 1px solid var(--red);
        backdrop-filter: blur(10px);
        width: 100%;
        max-width: 450px;
        text-align: center;
        box-shadow: 0 0 40px rgba(255, 0, 0, 0.15);
      }

      .hacker-title {
        font-size: 2.2rem;
        color: var(--red);
        text-transform: uppercase;
        letter-spacing: 6px;
        margin: 0 0 10px 0;
        text-shadow: 0 0 15px var(--red);
      }

      .status-line {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 5px;
        text-transform: uppercase;
      }

      .vibe-box {
        background: rgba(0, 0, 0, 0.6);
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 15px;
        border-left: 3px solid var(--red);
        text-align: left;
      }

      .label {
        color: var(--red);
        font-size: 0.7rem;
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .data-text {
        font-size: 1.1rem;
        color: #fff;
      }

      button {
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
        width: 100%;
        padding: 15px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        text-transform: uppercase;
        transition: 0.3s;
      }

      button:hover {
        background: var(--red);
        color: black;
        box-shadow: 0 0 20px var(--red);
      }

      #map-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--cyan);
        text-decoration: none;
        font-size: 0.8rem;
        border: 1px border var(--cyan);
      }

      #map-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="matrix-bg" id="matrix"></div>

    <div class="card">
      <h1 class="hacker-title">STALKER</h1>
      <div class="status-line">Surveillance Protocol Active</div>
      <div
        style="
          font-size: 0.7rem;
          color: #666;
          margin-bottom: 25px;

          text-transform: uppercase;
        "
      >
        (Completely safe website - Website and Religion Created by Aditi K Chauhan)
      </div>
      <div class="vibe-box">
        <span class="label">System Time</span>
        <div id="clock" class="data-text">--:--:--</div>
      </div>

      <div class="vibe-box">
        <span class="label">GPS Coordinates</span>
        <div id="location" class="data-text">Signal Offline</div>
      </div>

      <button onclick="locateUser()">Initialize Tracking</button>
    </div>

    <script>
      // Matrix Rain
      const matrixContainer = document.getElementById("matrix");
      const chars = "0123456789ABCDEFHIJKLMNOPQRSTUVWXYZ$#@&%";
      const columnCount = Math.floor(window.innerWidth / 20);

      for (let i = 0; i < columnCount; i++) {
        const column = document.createElement("div");
        column.className = "matrix-column";
        column.style.left = i * 20 + "px";
        column.style.animationDuration = Math.random() * 3 + 2 + "s";
        column.style.animationDelay = Math.random() * 5 + "s";
        let content = "";
        for (let j = 0; j < 20; j++) {
          content += chars[Math.floor(Math.random() * chars.length)] + "<br>";
        }
        column.innerHTML = content;
        matrixContainer.appendChild(column);
      }

      // Live Clock
      function updateClock() {
        const now = new Date();
        document.getElementById("clock").innerText = now.toLocaleTimeString();
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Geolocation with Google Maps
      function locateUser() {
        const locDisplay = document.getElementById("location");
        locDisplay.innerHTML = "Pinging Satellites...";

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;

              locDisplay.innerHTML = `
                LAT: ${lat.toFixed(5)}<br>
                LON: ${lon.toFixed(5)}<br>
                <a id="map-link" href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">>> OPEN SATELLITE MAP</a>
              `;
            },
            () => {
              locDisplay.innerHTML = "Access Denied. Signal Lost.";
            }
          );
        } else {
          locDisplay.innerText = "Error: System Incompatible.";
        }
      }
    </script>
  </body>
</html>
